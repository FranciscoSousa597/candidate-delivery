<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Single event sequence</title>
  <desc id="desc">The client posts sample-event.json to /_dev/messages. The service validates the event, locks the key and finds no applied version. It gets the product context (Linen Shirt 123, active), writes 3 units with version 7 to the Availability API, records version 7, publishes SizeAvailabilityUpdated to the event sink and answers 200 Applied.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#73726C"/>
    </marker>
  </defs>
  <rect width="820" height="640" rx="12" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1F1E1D">Single event: POST /_dev/messages with sample-event.json</text>
  <text x="24" y="56" font-size="13" fill="#5F5E5A">Happy path. Every outgoing call goes through the resilience pipeline shown in diagram 9.</text>

  <g font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">
    <rect x="20" y="76" width="80" height="44" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="60" y="98" fill="#2C2C2A">Client</text>
    <rect x="130" y="76" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="230" y="98" fill="#3C3489">Availability Processor</text>
    <rect x="350" y="76" width="176" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="438" y="98" fill="#085041">Product Context API</text>
    <rect x="540" y="76" width="152" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="616" y="98" fill="#085041">Availability API</text>
    <rect x="706" y="76" width="104" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="758" y="98" fill="#085041">Event sink</text>
  </g>

  <g fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4">
    <path d="M60 120 V600"/>
    <path d="M230 120 V176"/>
    <path d="M230 232 V404"/>
    <path d="M230 448 V600"/>
    <path d="M438 120 V600"/>
    <path d="M616 120 V600"/>
    <path d="M758 120 V600"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect x="135" y="176" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="230" y="196" font-size="14" font-weight="600" fill="#3C3489">Validate and lock</text>
    <text x="230" y="214" font-size="12" fill="#534AB7">no version applied yet</text>
    <rect x="135" y="404" width="190" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="230" y="426" font-size="14" font-weight="600" fill="#3C3489">Record version 7</text>
  </g>

  <g fill="none" stroke="#73726C" stroke-width="1.3">
    <path d="M60 150 H226" marker-end="url(#arrow)"/>
    <path d="M230 262 H434" marker-end="url(#arrow)"/>
    <path d="M438 296 H234" marker-end="url(#arrow)"/>
    <path d="M230 336 H612" marker-end="url(#arrow)"/>
    <path d="M616 370 H234" marker-end="url(#arrow)"/>
    <path d="M230 478 H754" marker-end="url(#arrow)"/>
    <path d="M758 512 H234" marker-end="url(#arrow)"/>
    <path d="M230 556 H64" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle">
    <text x="145" y="140">POST /_dev/messages</text>
    <text x="334" y="252">GET product context</text>
    <text x="334" y="286">200: Linen Shirt 123, ACTIVE</text>
    <text x="334" y="326">PUT 3 units, version 7</text>
    <text x="334" y="360">200 accepted</text>
    <text x="334" y="468">POST SizeAvailabilityUpdated</text>
    <text x="334" y="502">202 recorded</text>
    <text x="145" y="546">200 Applied</text>
  </g>

  <g font-size="12" fill="#5F5E5A">
    <rect x="20" y="612" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780"/>
    <text x="38" y="618" dominant-baseline="central">Caller</text>
    <rect x="110" y="612" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="128" y="618" dominant-baseline="central">This service</text>
    <rect x="230" y="612" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="248" y="618" dominant-baseline="central">Dependencies (WireMock in this exercise)</text>
  </g>
</svg>
