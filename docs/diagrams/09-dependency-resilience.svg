<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="592" viewBox="0 0 820 592" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Dependency call resilience</title>
  <desc id="desc">A client method's call passes through nested layers: a concurrency limiter of 16 calls in flight with 1,000 queued, a 60 second total timeout, a retry layer with up to 3 more attempts for 408, 429, 5xx, timeouts and network errors that waits for Retry-After or uses a 200 millisecond backoff, a circuit breaker that opens when half of 20 or more calls in 30 seconds fail and then rejects calls for 5 seconds without sending them, and a 10 second attempt timeout around the HTTP request. The call either succeeds or gives up with a DependencyException that says whether the failure is transient.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#73726C"/>
    </marker>
  </defs>
  <rect width="820" height="592" rx="12" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1F1E1D">Every dependency call goes through the same resilience pipeline</text>
  <text x="24" y="56" font-size="13" fill="#5F5E5A">One pipeline per dependency (Microsoft.Extensions.Http.Resilience, built on Polly); values from appsettings.json.</text>

  <g text-anchor="middle" dominant-baseline="central">
    <rect x="20" y="293" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="95" y="313" font-size="14" font-weight="600" fill="#2C2C2A">Caller</text>
    <text x="95" y="331" font-size="12" fill="#5F5E5A">client method</text>
  </g>

  <rect x="200" y="80" width="430" height="482" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="218" y="132" width="394" height="408" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="236" y="184" width="358" height="334" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="254" y="270" width="322" height="226" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="272" y="340" width="286" height="134" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="290" y="392" width="250" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>

  <g dominant-baseline="central">
    <text x="214" y="100" font-size="13" font-weight="600" fill="#3C3489">Concurrency limiter</text>
    <text x="214" y="118" font-size="12" fill="#534AB7">16 calls in flight, 1,000 queued</text>
    <text x="232" y="152" font-size="13" font-weight="600" fill="#3C3489">Total timeout</text>
    <text x="232" y="170" font-size="12" fill="#534AB7">60 s for the whole call, retries included</text>
    <text x="250" y="204" font-size="13" font-weight="600" fill="#3C3489">Retry</text>
    <text x="250" y="222" font-size="12" fill="#534AB7">up to 3 more attempts for 408, 429, 5xx,</text>
    <text x="250" y="238" font-size="12" fill="#534AB7">timeouts and network errors; 404 is final</text>
    <text x="250" y="254" font-size="12" fill="#534AB7">waits Retry-After, else 200 ms backoff</text>
    <text x="268" y="290" font-size="13" font-weight="600" fill="#3C3489">Circuit breaker</text>
    <text x="268" y="308" font-size="12" fill="#534AB7">opens when 50% of 20+ calls in 30 s fail,</text>
    <text x="268" y="324" font-size="12" fill="#534AB7">then rejects calls for 5 s without sending</text>
    <text x="286" y="360" font-size="13" font-weight="600" fill="#3C3489">Attempt timeout</text>
    <text x="286" y="378" font-size="12" fill="#534AB7">10 s per attempt</text>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="415" y="412" font-size="14" font-weight="600" fill="#085041">HTTP request</text>
    <text x="415" y="432" font-size="12" fill="#0F6E56">GET, PUT or POST to the dependency</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect x="650" y="236" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
    <text x="730" y="256" font-size="14" font-weight="600" fill="#27500A">Success</text>
    <text x="730" y="274" font-size="12" fill="#3B6D11">response returned</text>
    <rect x="650" y="346" width="160" height="72" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="730" y="366" font-size="14" font-weight="600" fill="#712B13">Gave up</text>
    <text x="730" y="384" font-size="12" fill="#993C1D">DependencyException</text>
    <text x="730" y="402" font-size="12" fill="#993C1D">flag: IsTransient</text>
  </g>

  <g fill="none" stroke="#73726C" stroke-width="1.3">
    <path d="M170 321 H196" marker-end="url(#arrow)"/>
    <path d="M630 264 H646" marker-end="url(#arrow)"/>
    <path d="M630 382 H646" marker-end="url(#arrow)"/>
  </g>
</svg>
