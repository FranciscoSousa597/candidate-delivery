<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Dependency call resilience</title>
  <desc id="desc">A client method's call passes through nested layers: a concurrency limiter of 16 calls in flight with 1,000 queued, a 60 second total timeout, a retry layer with up to 3 more attempts for 408, 429, 5xx, timeouts and network errors that waits for Retry-After or uses a 200 millisecond backoff, and a 10 second attempt timeout around the HTTP request. The call either succeeds or gives up with a DependencyException that says whether the failure is transient.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#73726C"/>
    </marker>
  </defs>
  <rect width="820" height="500" rx="12" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1F1E1D">Every dependency call goes through the same resilience pipeline</text>
  <text x="24" y="56" font-size="13" fill="#5F5E5A">One pipeline per dependency (Microsoft.Extensions.Http.Resilience, built on Polly); values from appsettings.json.</text>

  <g text-anchor="middle" dominant-baseline="central">
    <rect x="20" y="247" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="95" y="267" font-size="14" font-weight="600" fill="#2C2C2A">Caller</text>
    <text x="95" y="285" font-size="12" fill="#5F5E5A">client method</text>
  </g>

  <rect x="200" y="80" width="430" height="390" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="222" y="132" width="386" height="316" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="244" y="184" width="342" height="242" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="266" y="270" width="298" height="134" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="288" y="322" width="254" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>

  <g dominant-baseline="central">
    <text x="214" y="100" font-size="13" font-weight="600" fill="#3C3489">Concurrency limiter</text>
    <text x="214" y="118" font-size="12" fill="#534AB7">16 calls in flight, 1,000 queued</text>
    <text x="236" y="152" font-size="13" font-weight="600" fill="#3C3489">Total timeout</text>
    <text x="236" y="170" font-size="12" fill="#534AB7">60 s for the whole call, retries included</text>
    <text x="258" y="204" font-size="13" font-weight="600" fill="#3C3489">Retry</text>
    <text x="258" y="222" font-size="12" fill="#534AB7">up to 3 more attempts for 408, 429, 5xx,</text>
    <text x="258" y="238" font-size="12" fill="#534AB7">timeouts and network errors; 404 is final</text>
    <text x="258" y="254" font-size="12" fill="#534AB7">waits Retry-After, else 200 ms backoff</text>
    <text x="280" y="290" font-size="13" font-weight="600" fill="#3C3489">Attempt timeout</text>
    <text x="280" y="308" font-size="12" fill="#534AB7">10 s per attempt</text>
  </g>
  <g text-anchor="middle" dominant-baseline="central">
    <text x="415" y="342" font-size="14" font-weight="600" fill="#085041">HTTP request</text>
    <text x="415" y="362" font-size="12" fill="#0F6E56">GET, PUT or POST to the dependency</text>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect x="650" y="190" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
    <text x="730" y="210" font-size="14" font-weight="600" fill="#27500A">Success</text>
    <text x="730" y="228" font-size="12" fill="#3B6D11">response returned</text>
    <rect x="650" y="300" width="160" height="72" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="730" y="320" font-size="14" font-weight="600" fill="#712B13">Gave up</text>
    <text x="730" y="338" font-size="12" fill="#993C1D">DependencyException</text>
    <text x="730" y="356" font-size="12" fill="#993C1D">flag: IsTransient</text>
  </g>

  <g fill="none" stroke="#73726C" stroke-width="1.3">
    <path d="M170 275 H196" marker-end="url(#arrow)"/>
    <path d="M630 218 H646" marker-end="url(#arrow)"/>
    <path d="M630 336 H646" marker-end="url(#arrow)"/>
  </g>
</svg>
