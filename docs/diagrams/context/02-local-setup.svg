<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Local set-up for this exercise</title>
  <desc id="desc">You send requests by hand with curl or Postman, using the sample files from the package, to the Availability Processor on localhost port 5000. The processor calls WireMock, running in Docker on 127.0.0.1 port 8080, which stands in for the Product Context API, the Availability API and an event sink. You inspect the calls in WireMock's request journal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#73726C"/>
    </marker>
  </defs>
  <rect width="820" height="480" rx="12" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1F1E1D">This exercise: you play the seller and the broker, WireMock plays the other systems</text>
  <text x="24" y="56" font-size="13" fill="#5F5E5A">Everything runs on your machine; no real marketplace system is involved.</text>

  <g>
    <rect x="30" y="80" width="220" height="72" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="140" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Files from the package</text>
    <text x="140" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">sample-event.json</text>
    <text x="140" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">bulk-stock.csv</text>
  </g>
  <g>
    <rect x="30" y="180" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="140" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">You (curl or Postman)</text>
    <text x="140" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">send requests by hand</text>
  </g>
  <g>
    <rect x="310" y="180" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="420" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Availability Processor</text>
    <text x="420" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">dotnet run, localhost:5000</text>
  </g>

  <rect x="590" y="76" width="210" height="360" rx="12" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="695" y="96" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">WireMock in Docker</text>
  <text x="695" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">127.0.0.1:8080</text>
  <g>
    <rect x="605" y="130" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="695" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Product Context API</text>
    <text x="695" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">lookup and snapshot</text>
  </g>
  <g>
    <rect x="605" y="202" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="695" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Availability API</text>
    <text x="695" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">stock writes</text>
  </g>
  <g>
    <rect x="605" y="274" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="695" y="294" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Event sink</text>
    <text x="695" y="312" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">records output events</text>
  </g>
  <g>
    <rect x="605" y="362" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="695" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Request journal</text>
    <text x="695" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">/__admin/requests</text>
  </g>

  <g fill="none" stroke="#73726C" stroke-width="1.3">
    <path d="M140 152 V176" marker-end="url(#arrow)"/>
    <path d="M250 208 H306" marker-end="url(#arrow)"/>
    <path d="M530 208 H560 V158 H601" marker-end="url(#arrow)"/>
    <path d="M530 208 H560 V230 H601" marker-end="url(#arrow)"/>
    <path d="M530 208 H560 V302 H601" marker-end="url(#arrow)"/>
    <path d="M140 236 V390 H601" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#5F5E5A">
    <text x="148" y="164" dominant-baseline="central">used by curl</text>
    <text x="278" y="198" text-anchor="middle">HTTP</text>
    <text x="330" y="380" text-anchor="middle">you inspect the calls</text>
  </g>

  <g font-size="12" fill="#5F5E5A">
    <rect x="30" y="452" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="48" y="458" dominant-baseline="central">The code we deliver</text>
    <rect x="200" y="452" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="218" y="458" dominant-baseline="central">Mocks provided by the exercise</text>
    <rect x="440" y="452" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780"/>
    <text x="458" y="458" dominant-baseline="central">You and your inputs</text>
  </g>
</svg>
