<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="650" viewBox="0 0 820 650" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Processing pipeline</title>
  <desc id="desc">Six steps for every stock update: lock the stock key, compare versions, get the product context, write availability, record the applied version together with its event in one database transaction, and publish the event. A same or older version is skipped. A product that cannot be sold fails permanently. A write that keeps failing fails temporarily and the version is not recorded. If publishing keeps failing, the update stays applied and the event waits in the outbox.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#73726C"/>
    </marker>
  </defs>
  <rect width="820" height="650" rx="12" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1F1E1D">Processing pipeline: every stock update goes through the same six steps</text>
  <text x="24" y="56" font-size="13" fill="#5F5E5A">StockUpdateProcessor.ProcessAsync, called for single events (HTTP lookup) and for each CSV row (snapshot).</text>

  <g font-size="12" text-anchor="middle" dominant-baseline="central">
    <rect x="60" y="80" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="210" y="100" font-size="14" font-weight="600" fill="#3C3489">1. Lock the stock key</text>
    <text x="210" y="118" fill="#534AB7">one update per key at a time</text>

    <rect x="60" y="156" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="210" y="176" font-size="14" font-weight="600" fill="#3C3489">2. Compare versions</text>
    <text x="210" y="194" fill="#534AB7">with the latest applied version</text>

    <rect x="60" y="232" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="210" y="252" font-size="14" font-weight="600" fill="#3C3489">3. Get product context</text>
    <text x="210" y="270" fill="#534AB7">HTTP lookup or loaded snapshot</text>

    <rect x="60" y="308" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="210" y="328" font-size="14" font-weight="600" fill="#3C3489">4. Write availability</text>
    <text x="210" y="346" fill="#534AB7">PUT to the Availability API</text>

    <rect x="60" y="384" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="210" y="404" font-size="14" font-weight="600" fill="#3C3489">5. Record applied version</text>
    <text x="210" y="422" fill="#534AB7">with its event, in one transaction</text>

    <rect x="60" y="460" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="210" y="480" font-size="14" font-weight="600" fill="#3C3489">6. Publish the event</text>
    <text x="210" y="498" fill="#534AB7">SizeAvailabilityUpdated to the sink</text>

    <rect x="60" y="536" width="300" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="210" y="556" font-size="14" font-weight="600" fill="#27500A">Applied</text>
    <text x="210" y="574" fill="#3B6D11">stock written, event published</text>

    <rect x="420" y="156" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="600" y="176" font-size="14" font-weight="600" fill="#2C2C2A">Same or older version</text>
    <text x="600" y="194" fill="#5F5E5A">Skipped: DuplicateVersion or StaleVersion</text>

    <rect x="420" y="228" width="360" height="72" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="600" y="248" font-size="14" font-weight="600" fill="#712B13">Product cannot be sold</text>
    <text x="600" y="266" fill="#993C1D">Failed, permanent: nothing written</text>
    <text x="600" y="284" fill="#993C1D">API still down after retries: temporary</text>

    <rect x="420" y="308" width="360" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <text x="600" y="328" font-size="14" font-weight="600" fill="#712B13">Write failed after retries</text>
    <text x="600" y="346" fill="#993C1D">Failed, temporary: version not recorded</text>

    <rect x="420" y="452" width="360" height="72" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="600" y="472" font-size="14" font-weight="600" fill="#633806">Publishing failed after retries</text>
    <text x="600" y="490" fill="#854F0B">Still applied: event kept in the outbox</text>
    <text x="600" y="508" fill="#854F0B">the relay retries it every 10 s</text>
  </g>

  <g fill="none" stroke="#73726C" stroke-width="1.3">
    <path d="M210 136 V152" marker-end="url(#arrow)"/>
    <path d="M210 212 V228" marker-end="url(#arrow)"/>
    <path d="M210 288 V304" marker-end="url(#arrow)"/>
    <path d="M210 364 V380" marker-end="url(#arrow)"/>
    <path d="M210 440 V456" marker-end="url(#arrow)"/>
    <path d="M210 516 V532" marker-end="url(#arrow)"/>
    <path d="M360 184 H416" marker-end="url(#arrow)"/>
    <path d="M360 260 H416" marker-end="url(#arrow)"/>
    <path d="M360 336 H416" marker-end="url(#arrow)"/>
    <path d="M360 488 H416" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" fill="#5F5E5A">
    <rect x="60" y="614" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="78" y="620" dominant-baseline="central">Step</text>
    <rect x="130" y="614" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11"/>
    <text x="148" y="620" dominant-baseline="central">Applied</text>
    <rect x="220" y="614" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="238" y="620" dominant-baseline="central">Applied, event pending</text>
    <rect x="400" y="614" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D"/>
    <text x="418" y="620" dominant-baseline="central">Failed</text>
    <rect x="480" y="614" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780"/>
    <text x="498" y="620" dominant-baseline="central">Skipped</text>
  </g>
</svg>
