<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Production context</title>
  <desc id="desc">Sellers send stock changes to a marketplace integration API, which publishes SellerInventoryChanged events to a broker. The Availability Processor consumes those events and also accepts uploaded stock files. It reads product data from the Product Context API, writes to the Availability API and publishes SizeAvailabilityUpdated events that downstream consumers read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#73726C"/>
    </marker>
  </defs>
  <rect width="820" height="540" rx="12" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#1F1E1D">Production: sellers never call the processor directly</text>
  <text x="24" y="56" font-size="13" fill="#5F5E5A">Stock changes reach the processor through the marketplace's integration layer and broker (assumed set-up).</text>

  <g>
    <rect x="30" y="80" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="135" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Seller systems</text>
    <text x="135" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">ERP, shop, warehouse</text>
  </g>
  <g>
    <rect x="30" y="170" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="135" y="190" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Seller integration API</text>
    <text x="135" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">authenticates and validates</text>
  </g>
  <g>
    <rect x="30" y="260" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="135" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Message broker</text>
    <text x="135" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">SellerInventoryChanged</text>
  </g>
  <g>
    <rect x="30" y="380" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="135" y="400" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Sellers or operations</text>
    <text x="135" y="418" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">upload a stock file (CSV)</text>
  </g>

  <g>
    <rect x="320" y="140" width="200" height="296" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="420" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Availability Processor</text>
    <text x="420" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">this service</text>
  </g>

  <g>
    <rect x="590" y="140" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="695" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Product Context API</text>
    <text x="695" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">canonical product data</text>
  </g>
  <g>
    <rect x="590" y="240" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="695" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Availability API</text>
    <text x="695" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">stock per seller and size</text>
  </g>
  <g>
    <rect x="590" y="340" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="695" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Message broker</text>
    <text x="695" y="378" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">SizeAvailabilityUpdated</text>
  </g>
  <g>
    <rect x="590" y="440" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
    <text x="695" y="460" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Downstream consumers</text>
    <text x="695" y="478" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">other marketplace services</text>
  </g>

  <g fill="none" stroke="#73726C" stroke-width="1.3">
    <path d="M135 136 V166" marker-end="url(#arrow)"/>
    <path d="M135 226 V256" marker-end="url(#arrow)"/>
    <path d="M240 288 H316" marker-end="url(#arrow)"/>
    <path d="M240 408 H316" marker-end="url(#arrow)"/>
    <path d="M520 168 H586" marker-end="url(#arrow)"/>
    <path d="M520 268 H586" marker-end="url(#arrow)"/>
    <path d="M520 368 H586" marker-end="url(#arrow)"/>
    <path d="M695 396 V436" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle">
    <text x="280" y="276">consumes</text>
    <text x="280" y="396">uploads</text>
    <text x="553" y="158">read</text>
    <text x="553" y="258">write</text>
    <text x="553" y="358">publish</text>
  </g>

  <g font-size="12" fill="#5F5E5A">
    <rect x="30" y="507" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="48" y="513" dominant-baseline="central">This service</text>
    <rect x="170" y="507" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="188" y="513" dominant-baseline="central">Systems this service calls</text>
    <rect x="400" y="507" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780"/>
    <text x="418" y="513" dominant-baseline="central">Other systems</text>
  </g>
</svg>
